<style>
*{box-sizing:border-box;margin:0}
body{font:13px/1.3 system-ui,sans-serif;color:var(--tg-theme-text-color);padding:8px 10px calc(var(--tg-content-safe-area-inset-bottom,0px) + 6px) 20px}
.days{display:flex;gap:3px}
.day{flex:1;text-align:center;padding:4px 0;border-radius:10px;background:var(--tg-theme-secondary-bg-color);font-size:11px;line-height:1.3}
.day b{display:block;font-size:14px}
.day.on{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.sum{margin:8px 0 6px}
.sum small,.h,.ft{color:var(--tg-theme-hint-color)}
.sum small{display:block;font-size:12px}
.grid{display:flex;position:relative}
.col{flex:1;text-align:center;font-size:10px;line-height:13px;border-radius:6px;padding:2px 0}
.col.best{background:rgba(52,199,89,.15)}
.col.past{opacity:.4}
.col.on{box-shadow:inset 0 0 0 1.5px var(--tg-theme-button-color)}
.ic{font-size:12px;height:16px}
.ch{height:50px}
svg{position:absolute;left:0;top:33px;width:100%;height:50px;pointer-events:none}
.w{font-weight:600}
.w1{color:#e8a33d}
.w2{color:var(--tg-theme-destructive-text-color)}
.p{color:var(--tg-theme-link-color);height:13px}
.det span{white-space:nowrap}
.lg{font-size:10px;margin-top:3px;color:var(--tg-theme-hint-color)}
.lg i{font-style:normal;color:var(--tg-theme-link-color)}
.det{margin:6px 0;padding:6px 8px;border-radius:10px;background:var(--tg-theme-secondary-bg-color)}
.ft{display:flex;align-items:center;gap:8px;font-size:11px}
button{font:inherit;font-size:12px;border:0;border-radius:8px;padding:5px 10px;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
</style>
<div class="days" id="days"></div>
<div class="sum" id="sum"></div>
<div class="grid" id="grid"></div>
<div class="lg" id="lg"></div>
<div class="det" id="det"></div>
<div class="ft"><button id="btn"></button><span id="upd"></span></div>
<script>
(function () {
  var L = __L__, WIND = __W__;
  var W = window.TelegramWidget, $ = function (id) { return document.getElementById(id); };
  var data = null, day = 0, hour = -1;

  // Числа упакованы по одному символу: '#'..'}' без '\' — значения 0..89, '~' — нет данных
  function num(s, i, shift) {
    var c = s.charCodeAt(i);
    if (c === 126) return null;
    return c - 35 - (c > 92 ? 1 : 0) - shift;
  }
  function hours(d) {
    var s = d[6], out = [];
    for (var i = 0; i < 13; i++) {
      var k = i * 5;
      out.push({h: 6 + i, t: num(s, k, 60), f: num(s, k + 1, 60), w: num(s, k + 2, 0), p: num(s, k + 3, 0), i: num(s, k + 4, 0)});
    }
    return out;
  }
  function deg(v) { return v === null ? '—' : (v > 0 ? '+' + v : v < 0 ? '−' + (-v) : '0') + '°'; }
  function minus(v) { return v === null ? '' : v < 0 ? '−' + (-v) : '' + v; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function icon(x) { return x.i === null ? '' : data.i[x.i] || ''; }
  function label(d) { return (d[2] === 0 ? L.today : d[2] === 1 ? L.tomorrow : L.wd[d[1]]) + ', ' + d[0]; }

  function pickHour(d) {
    if (d[2] === 0 && data.n >= 6 && data.n <= 18) return data.n;
    if (d[4]) return +d[4].slice(0, 2);
    return 12;
  }

  function render() {
    try { data = JSON.parse(W ? W.chatData : null); } catch (e) { data = null; }
    if (!data || !data.d || !data.d.length) { $('sum').textContent = L.none; return; }
    if (day >= data.d.length) day = 0;
    var d = data.d[day], hs = hours(d), html = '';
    if (hour < 0) hour = pickHour(d);

    data.d.forEach(function (x, i) {
      html += '<div class="day' + (i === day ? ' on' : '') + '" data-d="' + i + '">' + L.wd[x[1]] +
        '<b>' + x[0] + '</b>' + L.icons[x[3]] + '</div>';
    });
    $('days').innerHTML = html;

    var best = d[4] ? [+d[4].slice(0, 2), +d[4].slice(-2)] : null;
    $('sum').innerHTML = L.icons[d[3]] + ' <b>' + esc(label(d)) + '</b> — ' + esc(L[d[3]]) +
      (d[5] || best ? '<small>' + esc(d[5]) + (d[5] && best ? ' · ' : '') + (best ? esc(L.best.replace('{span}', d[4])) : '') + '</small>' : '');

    // Шкала температуры: ощущаемая и воздух на одном графике
    var vals = [];
    hs.forEach(function (x) { if (x.t !== null) vals.push(x.t); if (x.f !== null) vals.push(x.f); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi - lo < 4) { lo -= 2; hi += 2; }
    function y(v) { return 4 + (hi - v) / (hi - lo) * 42; }
    function line(key) {
      var pts = [];
      hs.forEach(function (x, i) { if (x[key] !== null) pts.push((i * 24 + 12) + ',' + y(x[key]).toFixed(1)); });
      return pts.join(' ');
    }

    html = '';
    hs.forEach(function (x) {
      var cls = 'col';
      if (best && x.h >= best[0] && x.h < best[1]) cls += ' best';
      if (d[2] === 0 && x.h < data.n) cls += ' past';
      if (x.h === hour) cls += ' on';
      var w = x.w === null ? '' : x.w;
      html += '<div class="' + cls + '" data-h="' + x.h + '"><div class="ic">' + icon(x) + '</div><div>' + minus(x.t) +
        '</div><div class="ch"></div><div class="p">' + (x.p !== null && x.p >= 2 ? x.p * 10 : '') + '</div>' +
        '<div class="w' + (x.w >= WIND[1] ? ' w2' : x.w >= WIND[0] ? ' w1' : '') + '">' + w + '</div><div class="h">' +
        (x.h < 10 ? '0' : '') + x.h + '</div></div>';
    });
    html += '<svg viewBox="0 0 312 50" preserveAspectRatio="none">' +
      '<polyline points="' + line('f') + '" fill="none" stroke="var(--tg-theme-hint-color)" stroke-width="1.5" stroke-dasharray="3 3"/>' +
      '<polyline points="' + line('t') + '" fill="none" stroke="var(--tg-theme-link-color)" stroke-width="2.5" stroke-linejoin="round"/></svg>';
    $('grid').innerHTML = html;

    var x = hs[hour - 6];
    $('det').innerHTML = x && x.t !== null
      ? '<span><b>' + (hour < 10 ? '0' : '') + hour + ':00</b> ' + icon(x) + ' <b>' + deg(x.t) + '</b></span> <span>(' + esc(L.feels) +
        ' ' + deg(x.f) + ')</span> · <span>💨 ' + x.w + ' ' + esc(L.ms) + '</span>' + (x.p !== null ? ' · <span>💧 ' + x.p * 10 + '%</span>' : '')
      : esc(L.none);
    $('upd').textContent = L.upd + ' ' + data.u;
  }

  function tap(e) {
    var el = e.target;
    while (el && el.getAttribute && el.getAttribute('data-d') === null && el.getAttribute('data-h') === null) el = el.parentNode;
    if (!el || !el.getAttribute) return;
    if (el.getAttribute('data-d') !== null) {
      var i = +el.getAttribute('data-d');
      if (i === day) return;
      day = i;
      hour = -1;
    } else {
      var h = +el.getAttribute('data-h');
      if (h === hour) return;
      hour = h;
    }
    if (W && W.HapticFeedback) W.HapticFeedback.selectionChanged();
    render();
  }
  $('days').addEventListener('click', tap);
  $('grid').addEventListener('click', tap);

  $('lg').innerHTML = '<i>━</i> ' + esc(L.air) + ' · ┄ ' + esc(L.feels) + ' · 💧 % · 💨 ' + esc(L.ms);
  var btn = $('btn');
  btn.textContent = L.refresh;
  btn.addEventListener('click', function () {
    if (!W || !data || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '⏳';
    W.request('r' + data.k).then(function (r) {
      btn.textContent = r.result === 'ok' ? L.refresh : L.err;
    }, function (e) {
      btn.textContent = e.code === 'RATE_LIMITED' || e.code === 'BUSY' ? L.wait : L.err;
    }).then(function () {
      btn.disabled = false;
      setTimeout(function () { btn.textContent = L.refresh; }, 3000);
    });
  });

  if (W) W.onEvent('chatDataChanged', render);
  render();
  if (W && W.ready) W.ready();
})();
</script>
