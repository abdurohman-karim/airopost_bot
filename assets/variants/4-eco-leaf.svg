<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AiroPost — лист и ветер</title>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="leaf" gradientUnits="userSpaceOnUse" x1="150" y1="380" x2="400" y2="120">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#D9F99D"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#forest)"/>

  <!-- солнце -->
  <circle cx="160" cy="158" r="58" fill="url(#sun)"/>

  <!-- лист -->
  <path d="M 172 372 C 162 236 252 138 404 120 C 410 274 318 372 172 372 Z"
        fill="#022C22" opacity="0.4" filter="url(#shadow)" transform="translate(6 14)"/>
  <path d="M 172 372 C 162 236 252 138 404 120 C 410 274 318 372 172 372 Z" fill="url(#leaf)"/>
  <!-- прожилки -->
  <g fill="none" stroke="#15803D" stroke-linecap="round">
    <path d="M 172 372 C 240 300 310 220 380 146" stroke-width="10"/>
    <path d="M 238 300 C 236 266 244 238 256 216" stroke-width="7"/>
    <path d="M 286 250 C 288 222 300 198 314 180" stroke-width="7"/>
    <path d="M 252 286 C 284 288 318 280 346 262" stroke-width="7"/>
  </g>

  <!-- ветер -->
  <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
    <path d="M 96 418 H 330 a 26 26 0 1 0 -26 -26"/>
    <path d="M 150 452 H 262" opacity="0.7"/>
  </g>
</svg>
