<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AiroPost — бумажный самолётик</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="0.6" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingTop" gradientUnits="userSpaceOnUse" x1="140" y1="150" x2="390" y2="300">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#dusk)"/>

  <!-- закатное солнце -->
  <circle cx="256" cy="368" r="176" fill="url(#sun)" opacity="0.75"/>

  <!-- пунктирный след с петлёй -->
  <path d="M 44 452 C 112 450 156 414 148 368 C 140 324 88 330 96 368 C 104 408 176 398 214 334"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 16" opacity="0.85"/>

  <g transform="translate(-10 22)">
  <!-- тень самолётика -->
  <path d="M 404 132 L 136 246 L 232 284 L 264 384 Z" fill="#831843" opacity="0.35" filter="url(#shadow)" transform="translate(8 14)"/>

  <!-- самолётик -->
  <path d="M 404 132 L 136 246 L 232 284 Z" fill="url(#wingTop)"/>
  <path d="M 404 132 L 232 284 L 264 384 Z" fill="#E2E8F0"/>
  <path d="M 232 284 L 264 384 L 246 312 Z" fill="#94A3B8"/>
  <path d="M 404 132 L 232 284" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
